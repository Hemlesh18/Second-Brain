[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "second-brain"
version = "0.1.0"
description = "Personal Second Brain powered by local LLMs (Llama 3 / Mistral via Ollama)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-ollama>=0.1.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
second-brain = "second_brain.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["second_brain*"]
